<button
  type="button"
  class="dp__field"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  [class.dp__field--disabled]="disabled()"
  [disabled]="disabled()"
  (click)="toggle()"
>
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" class="dp__field-icon">
    <rect x="3" y="4.5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
    <path d="M3 9h18M8 2.5v4M16 2.5v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
  </svg>
  <span class="dp__value" [class.dp__value--placeholder]="!display()">{{ display() || placeholder() }}</span>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
>
  <div class="dp__panel">
    <div class="dp__header">
      <button type="button" class="dp__nav" (click)="prevMonth($event)" aria-label="Previous month">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 4l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="dp__month">{{ monthLabel() }}</span>
      <button type="button" class="dp__nav" (click)="nextMonth($event)" aria-label="Next month">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="dp__weekdays">
      @for (wd of weekdays; track wd) {
        <span class="dp__weekday">{{ wd }}</span>
      }
    </div>

    <div class="dp__grid">
      @for (cell of days(); track cell.date.getTime()) {
        <button
          type="button"
          class="dp__day"
          [class.dp__day--muted]="!cell.inMonth"
          [class.dp__day--today]="cell.isToday"
          [class.dp__day--selected]="isSelected(cell.date)"
          (click)="select(cell)"
        >{{ cell.date.getDate() }}</button>
      }
    </div>
  </div>
</ng-template>
