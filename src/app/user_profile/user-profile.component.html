<c-dropdown [popperOptions]="{ placement: 'bottom-end' }" variant="nav-item" class="up">
  <button [caret]="false" cDropdownToggle class="up__trigger" aria-label="Open account menu">
    <span class="up__avatar" [style.--up-hue]="hue()">
      {{ initials() }}<span class="up__avatar-status" title="Online"></span>
    </span>
    <span class="up__meta">
      <span class="up__name">{{ user()?.displayName ?? 'Account' }}</span>
      <span class="up__role">{{ user()?.role ?? 'Operator' }}</span>
    </span>
    <svg class="up__chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <div cDropdownMenu class="up__menu">
    <div class="up__hero">
      <span class="up__avatar up__avatar--lg" [style.--up-hue]="hue()">{{ initials() }}</span>
      <div class="up__hero-info">
        <div class="up__hero-name">{{ user()?.displayName ?? 'Account' }}</div>
        <div class="up__hero-role"><span class="up__role-dot"></span>{{ user()?.role ?? 'Operator' }}</div>
      </div>
    </div>

    <dl class="up__fields">
      <div class="up__field">
        <dt>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7" />
            <path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          User ID
        </dt>
        <dd [title]="user()?.username ?? ''">{{ user()?.username ?? '—' }}</dd>
      </div>
      <div class="up__field">
        <dt>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7" />
            <path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Email
        </dt>
        <dd [title]="user()?.email ?? ''">{{ user()?.email ?? '—' }}</dd>
      </div>
      @if (sinceLogin()) {
        <div class="up__field">
          <dt>
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Signed in
          </dt>
          <dd [title]="loginAtText() ?? ''">
            <span class="up__since">{{ sinceLogin() }}</span>
            @if (loginAtText()) { <span class="up__since-abs">{{ loginAtText() }}</span> }
          </dd>
        </div>
      }
    </dl>

    <button type="button" class="up__logout" (click)="logout()">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="M10 12h9m0 0-3-3m3 3-3 3M4 4v16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Sign out
    </button>
  </div>
</c-dropdown>
