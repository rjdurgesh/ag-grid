<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="OSHIVA AI architecture: client, edge rate-limit, API, authentication and authorization, coordinator, specialist agents, per-domain tools to existing backends, the GPT-OSS LLM layer, and cross-cutting services (session store, PII redaction, observability and cost, eval suite, RAG).">
  <title>OSHIVA — AI architecture</title>
  <desc>A layered view: request flows Client to Edge (rate-limit) to API, gated by Authentication and Authorization, into the Coordinator which routes to one specialist agent; the agent calls per-domain tools that reach the existing backends; the brain is the self-hosted GPT-OSS. Cross-cutting services (session store, PII redaction, observability and cost, eval suite, RAG) support every turn. Colour of each box shows build status.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <style>
    .r     { rx:11; ry:11; stroke-width:1.6; }
    .built { fill:#e7f7ea; stroke:#22a058; }
    .part  { fill:#fff5e0; stroke:#e0a020; }
    .plan  { fill:#eef1f5; stroke:#94a3b8; stroke-dasharray:6 4; }
    .brain { fill:#f3e8ff; stroke:#a855f7; }
    .cli   { fill:#e0f0ff; stroke:#3b82f6; }
    .t     { fill:#0f172a; font-size:15px; font-weight:600; }
    .s     { fill:#475569; font-size:11.5px; }
    .cd    { fill:#1e293b; font-size:11px; font-family:Consolas,"Courier New",monospace; }
    .lbl   { fill:#334155; font-size:12px; font-weight:700; letter-spacing:.04em; }
    .ln    { stroke:#64748b; stroke-width:1.7; fill:none; }
  </style>

  <!-- header band -->
  <rect x="0" y="0" width="1000" height="60" fill="url(#hdr)"/>
  <text x="28" y="30" fill="#fff" font-size="22" font-weight="700">OSHIVA — AI architecture</text>
  <text x="28" y="49" fill="#e0e7ff" font-size="13">OLS Hybrid Intelligence Virtual Assistant · self-hosted, RBAC-gated, tool-using agent</text>

  <!-- legend -->
  <g transform="translate(628,14)">
    <rect x="0"   y="4"  width="13" height="13" class="r built"/><text x="18" y="15" class="s" fill="#eef">built</text>
    <rect x="86"  y="4"  width="13" height="13" class="r part"/><text x="104" y="15" class="s" fill="#eef">partial</text>
    <rect x="176" y="4"  width="13" height="13" class="r plan"/><text x="194" y="15" class="s" fill="#eef">planned</text>
    <rect x="278" y="4"  width="13" height="13" class="r brain"/><text x="296" y="15" class="s" fill="#eef">the model</text>
  </g>

  <!-- ============ main spine (left/centre column) ============ -->
  <!-- Client -->
  <rect x="330" y="82" width="340" height="52" class="r cli"/>
  <text x="500" y="103" text-anchor="middle" class="t">Client — chat widget</text>
  <text x="500" y="121" text-anchor="middle" class="cd">src/app/oshiva/  (Angular, SSE stream)</text>

  <!-- Edge / rate limit -->
  <rect x="330" y="150" width="340" height="52" class="r part"/>
  <text x="500" y="171" text-anchor="middle" class="t">Edge — rate limiting</text>
  <text x="500" y="189" text-anchor="middle" class="cd">auth/rate_limit.py  (per-caller window)</text>

  <!-- API -->
  <rect x="330" y="218" width="340" height="52" class="r built"/>
  <text x="500" y="239" text-anchor="middle" class="t">API — FastAPI router</text>
  <text x="500" y="257" text-anchor="middle" class="cd">oshiva/api.py  /api/assistant/*</text>

  <!-- Auth pair -->
  <rect x="330" y="286" width="164" height="60" class="r part"/>
  <text x="412" y="307" text-anchor="middle" class="t" font-size="14">Authentication</text>
  <text x="412" y="324" text-anchor="middle" class="s">who are you?</text>
  <text x="412" y="338" text-anchor="middle" class="cd">OIDC / SSO</text>
  <rect x="506" y="286" width="164" height="60" class="r built"/>
  <text x="588" y="307" text-anchor="middle" class="t" font-size="14">Authorization</text>
  <text x="588" y="324" text-anchor="middle" class="s">what may you see?</text>
  <text x="588" y="338" text-anchor="middle" class="cd">auth/gate + scope_access</text>

  <!-- Coordinator -->
  <rect x="330" y="362" width="340" height="54" class="r built"/>
  <text x="500" y="383" text-anchor="middle" class="t">Coordinator — routes the turn</text>
  <text x="500" y="401" text-anchor="middle" class="cd">agents/coordinator.py → registry.route()</text>

  <!-- Agents -->
  <rect x="330" y="432" width="340" height="66" class="r built"/>
  <text x="500" y="452" text-anchor="middle" class="t">Specialist agents (one per turn)</text>
  <text x="500" y="470" text-anchor="middle" class="s">Infra · Database (OCC) · Config Ops · Regression</text>
  <text x="500" y="486" text-anchor="middle" class="cd">agents/registry.py · runner.py (tool loop)</text>

  <!-- Tools -->
  <rect x="330" y="514" width="340" height="66" class="r built"/>
  <text x="500" y="534" text-anchor="middle" class="t">Tools — per-domain modules</text>
  <text x="500" y="552" text-anchor="middle" class="s">list_servers · blocking_sessions · query_table …</text>
  <text x="500" y="568" text-anchor="middle" class="cd">tools/*.py + registry.run_tool()  (MCP later)</text>

  <!-- Backends -->
  <rect x="330" y="596" width="340" height="52" class="r built"/>
  <text x="500" y="617" text-anchor="middle" class="t">Existing OLS backends</text>
  <text x="500" y="635" text-anchor="middle" class="s">Infra Pulse · Oracle CC · Config Ops · Regression (real data)</text>

  <!-- spine arrows -->
  <path class="ln" d="M500 134 L500 148" marker-end="url(#a)"/>
  <path class="ln" d="M500 202 L500 216" marker-end="url(#a)"/>
  <path class="ln" d="M500 270 L500 284" marker-end="url(#a)"/>
  <path class="ln" d="M500 346 L500 360" marker-end="url(#a)"/>
  <path class="ln" d="M500 416 L500 430" marker-end="url(#a)"/>
  <path class="ln" d="M500 498 L500 512" marker-end="url(#a)"/>
  <path class="ln" d="M500 580 L500 594" marker-end="url(#a)"/>

  <!-- ============ LLM layer (right) ============ -->
  <rect x="722" y="432" width="248" height="80" class="r brain"/>
  <text x="846" y="456" text-anchor="middle" class="t">LLM layer — the brain</text>
  <text x="846" y="474" text-anchor="middle" class="s">self-hosted GPT-OSS (private)</text>
  <text x="846" y="490" text-anchor="middle" class="cd">llm/client.py  stub ↔ real</text>
  <text x="846" y="504" text-anchor="middle" class="s">3rd-party LLM: omitted (confidentiality)</text>
  <path class="ln" d="M722 465 L672 465" marker-end="url(#a)"/>
  <path class="ln" d="M672 480 L722 480" marker-end="url(#a)"/>
  <text x="697" y="458" text-anchor="middle" class="s">ask</text>

  <!-- ============ cross-cutting band (bottom) ============ -->
  <text x="28" y="690" class="lbl">CROSS-CUTTING SERVICES — support every turn</text>
  <line x1="28" y1="698" x2="972" y2="698" stroke="#cbd5e1" stroke-width="1"/>

  <g>
    <rect x="28"  y="712" width="176" height="86" class="r built"/>
    <text x="116" y="734" text-anchor="middle" class="t" font-size="14">Session Store</text>
    <text x="116" y="752" text-anchor="middle" class="s">memory across turns</text>
    <text x="116" y="768" text-anchor="middle" class="cd">memory/sessions.py</text>
    <text x="116" y="786" text-anchor="middle" class="s">per conversation · TTL</text>

    <rect x="216" y="712" width="176" height="86" class="r built"/>
    <text x="304" y="734" text-anchor="middle" class="t" font-size="14">PII Redaction</text>
    <text x="304" y="752" text-anchor="middle" class="s">scrub secrets + PII</text>
    <text x="304" y="768" text-anchor="middle" class="cd">security/redaction.py</text>
    <text x="304" y="786" text-anchor="middle" class="s">before model + audit</text>

    <rect x="404" y="712" width="176" height="86" class="r part"/>
    <text x="492" y="734" text-anchor="middle" class="t" font-size="14">Observability + Cost</text>
    <text x="492" y="752" text-anchor="middle" class="s">tokens · latency · cost</text>
    <text x="492" y="768" text-anchor="middle" class="cd">observability/audit.py</text>
    <text x="492" y="786" text-anchor="middle" class="s">append-only JSONL</text>

    <rect x="592" y="712" width="176" height="86" class="r built"/>
    <text x="680" y="734" text-anchor="middle" class="t" font-size="14">Eval Suite</text>
    <text x="680" y="752" text-anchor="middle" class="s">golden Q&amp;A + guardrails</text>
    <text x="680" y="768" text-anchor="middle" class="cd">eval/ · python -m oshiva.eval</text>
    <text x="680" y="786" text-anchor="middle" class="s">deterministic CI gate</text>

    <rect x="780" y="712" width="192" height="86" class="r plan"/>
    <text x="876" y="734" text-anchor="middle" class="t" font-size="14">RAG (knowledge)</text>
    <text x="876" y="752" text-anchor="middle" class="s">retriever + vector store</text>
    <text x="876" y="768" text-anchor="middle" class="cd">Phase 2.1</text>
    <text x="876" y="786" text-anchor="middle" class="s">grounding from docs</text>
  </g>

  <!-- link band to spine -->
  <path class="ln" d="M500 648 L500 706" marker-end="url(#a)"/>
  <text x="516" y="676" class="s">every turn is logged, scrubbed, remembered &amp; gradeable</text>

  <text x="28" y="852" class="s">Status: colour shows build state (see legend). Full detail &amp; roadmap: AI_ARCHITECTURE.md · each box's own doc listed in ai-learning/README.md.</text>
</svg>
